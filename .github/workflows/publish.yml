name: Publish Package

# Trusted Publishing (OIDC): no npm token and no 2FA prompt on the runner.
# Requires a Trusted Publisher entry on npmjs.com for this package:
#   Organization or user: ZiMing-X
#   Repository:           wishos-plan-book
#   Workflow filename:    publish.yml
#   Allowed actions:      [x] npm publish (direct publish)  [x] npm dist-tag (optional)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # self-hosted runners are not supported by trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Tool versions
        run: node -v && npm -v
      - name: Publish with provenance
        run: npm publish --access public --provenance
